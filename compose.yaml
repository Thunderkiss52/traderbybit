name: ${COMPOSE_PROJECT_NAME:-bybit-signals}

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-Bybit Signals}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://127.0.0.1:18080}
  APP_TIMEZONE: UTC
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-bybit_signals}
  DB_USERNAME: ${POSTGRES_USER:-bybit_signals}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  DB_SSLMODE: disable
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_PREFIX: bybit-signals-
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_QUEUE: default
  REDIS_QUEUE_RETRY_AFTER: "3700"
  UI_BACKTEST_TOKEN: ${UI_BACKTEST_TOKEN:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

x-php-service: &php-service
  image: ${APP_IMAGE:-bybit-signals-app}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - ${ENV_FILE:-.env.production}
  environment: *app-environment
  volumes:
    - app_storage:/var/www/html/storage
  networks:
    - internal
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &default-logging
    driver: json-file
    options:
      max-size: ${LOG_MAX_SIZE:-10m}
      max-file: ${LOG_MAX_FILES:-3}
  stop_grace_period: 45s

services:
  app:
    <<: *php-service
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: app
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",9000,$$e,$$m,2); exit($$s ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${APP_MEMORY_LIMIT:-512m}
    cpus: ${APP_CPU_LIMIT:-1.0}

  web:
    image: ${WEB_IMAGE:-bybit-signals-web}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    restart: unless-stopped
    environment:
      UI_BASIC_AUTH_USER: ${UI_BASIC_AUTH_USER:?UI_BASIC_AUTH_USER is required}
      UI_BASIC_AUTH_PASSWORD: ${UI_BASIC_AUTH_PASSWORD:-}
      UI_BASIC_AUTH_PASSWORD_B64: ${UI_BASIC_AUTH_PASSWORD_B64:-}
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-18080}:80"
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    stop_grace_period: 20s
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    cpus: ${WEB_CPU_LIMIT:-0.5}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bybit_signals}
      POSTGRES_USER: ${POSTGRES_USER:-bybit_signals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    stop_grace_period: 60s
    shm_size: ${POSTGRES_SHM_SIZE:-256m}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy volatile-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    stop_grace_period: 30s
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}

  queue:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=2", "--tries=3", "--timeout=900", "--max-time=3600", "--memory=${QUEUE_WORKER_MEMORY_MB:-384}", "--no-interaction"]
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'queue:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${QUEUE_MEMORY_LIMIT:-512m}
    cpus: ${QUEUE_CPU_LIMIT:-1.0}

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'schedule:work'"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-256m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.25}

  market-ws:
    <<: *php-service
    command: ["php", "artisan", "market:stream-candles", "--no-interaction"]
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'market:stream-candles'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: ${MARKET_WS_MEMORY_LIMIT:-256m}
    cpus: ${MARKET_WS_CPU_LIMIT:-0.5}


  audit-worker:
    <<: *php-service
    # Dedicated low-priority research export worker; never consumes the trading queue.
    command: ["php", "-d", "memory_limit=192M", "artisan", "queue:work", "redis", "--queue=audit", "--sleep=3", "--tries=2", "--timeout=1800", "--max-time=3600", "--memory=192", "--no-interaction"]
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'queue:work.*audit'"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 90s
    mem_limit: ${AUDIT_MEMORY_LIMIT:-384m}
    mem_reservation: ${AUDIT_MEMORY_RESERVATION:-128m}
    cpus: ${AUDIT_CPU_LIMIT:-0.50}

  backtest-worker:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "redis", "--queue=backtests,research", "--sleep=3", "--tries=2", "--timeout=3600", "--max-time=7200", "--memory=${BACKTEST_WORKER_MEMORY_MB:-768}", "--no-interaction"]
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' </proc/1/cmdline | grep -q 'queue:work.*backtests'"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 90s
    mem_limit: ${BACKTEST_MEMORY_LIMIT:-2g}
    cpus: ${BACKTEST_CPU_LIMIT:-2.0}

  research-worker:
    image: ${RESEARCH_WORKER_IMAGE:-bybit-signals-research-worker}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/go/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-bybit_signals}
      DB_USERNAME: ${POSTGRES_USER:-bybit_signals}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_SSLMODE: disable
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    stop_grace_period: 30s
    mem_limit: ${RESEARCH_WORKER_MEMORY_LIMIT:-512m}
    cpus: ${RESEARCH_WORKER_CPU_LIMIT:-1.0}

networks:
  internal:
    name: ${COMPOSE_PROJECT_NAME:-bybit-signals}_internal
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-bybit-signals}_postgres_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-bybit-signals}_redis_data
  app_storage:
    name: ${COMPOSE_PROJECT_NAME:-bybit-signals}_app_storage

name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Protected branch or release tag to deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: bybit-signals-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      image_base: ${{ steps.image.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: image
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_pgsql, redis, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: php artisan test
      - run: ./vendor/bin/pint --test
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: app
          push: true
          tags: ${{ needs.test.outputs.image_base }}/app:sha-${{ needs.test.outputs.sha }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app
          provenance: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          push: true
          tags: ${{ needs.test.outputs.image_base }}/web:sha-${{ needs.test.outputs.sha }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web
          provenance: true

  deploy:
    needs: [test, images]
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      RELEASE_SHA: ${{ needs.test.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - name: Prepare verified SSH identity
        shell: bash
        run: |
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.DEPLOY_SSH_HOST_KEY }}' > ~/.ssh/known_hosts
      - name: Package immutable deployment controls
        shell: bash
        run: |
          tar -czf "/tmp/${RELEASE_SHA}.tar.gz" \
            compose.yaml compose.proxy.yaml .env.production.example \
            docker
          cd /tmp
          sha256sum "${RELEASE_SHA}.tar.gz" > "${RELEASE_SHA}.tar.gz.sha256"
      - name: Upload release controls
        shell: bash
        run: |
          scp -P "${DEPLOY_PORT}" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/${RELEASE_SHA}.tar.gz" "/tmp/${RELEASE_SHA}.tar.gz.sha256" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/bybit-signals/incoming/"
      - name: Activate release
        shell: bash
        run: |
          ssh -p "${DEPLOY_PORT}" -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "sudo /usr/local/sbin/bybit-signals-deploy '${RELEASE_SHA}'"
      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Production deployment'
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo '- Database migrations are never automatically rolled back.'
          } >> "$GITHUB_STEP_SUMMARY"

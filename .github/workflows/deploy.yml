name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-signals-production
  cancel-in-progress: false

jobs:
  go-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: research-go/go.sum
      - name: Verify Go module
        run: go mod verify
      - name: Build Go packages
        run: go build ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run Go tests
        run: go test ./...
      - name: Run Go race detector
        run: go test -race ./...

  backend-tests:
    needs: go-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bybit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 25432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bybit_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: bybit_test
      DB_HOST: 127.0.0.1
      DB_PORT: 25432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      DB_USERNAME: postgres
      DB_PASSWORD: testpass
      DB_URL: ''
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 25432
      TEST_DB_DATABASE: bybit_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: testpass
      RUN_DB: bybit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5.12'
          tools: composer:v2
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, pdo_pgsql, intl, pcntl, zip, bcmath, redis, opcache
          coverage: none
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare isolated testing environment
        shell: bash
        run: |
          cp .env.example .env
          chmod 600 .env
      - name: Verify isolated PostgreSQL identity
        run: php scripts/verify-test-database.php
      - name: Migrate PostgreSQL test database
        run: php artisan migrate --database=pgsql --force
      - name: Run PHPUnit
        run: php artisan test --no-ansi
      - name: Check PHP formatting
        run: vendor/bin/pint --test

  frontend-tests:
    needs: go-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  publish-images:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [app, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Determine GHCR image name
        id: images
        shell: bash
        run: |
          repo_lc="${GITHUB_REPOSITORY,,}"
          echo "tag=ghcr.io/${repo_lc}/${{ matrix.target }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture immutable build metadata
        id: build-metadata
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: ${{ matrix.target }}
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.build-metadata.outputs.timestamp }}
          tags: ${{ steps.images.outputs.tag }}
          cache-from: type=gha,scope=bybit-${{ matrix.target }}
          cache-to: type=gha,scope=bybit-${{ matrix.target }},mode=max

  deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package and deploy selected commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is missing}"
          : "${DEPLOY_USER:?DEPLOY_USER is missing}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is missing}"
          : "${DEPLOY_SSH_HOST_KEY:?DEPLOY_SSH_HOST_KEY is missing}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid SSH port'; exit 2; }
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid commit SHA'; exit 2; }

          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519")
          (umask 077; printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts")
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          archive="$RUNNER_TEMP/${GITHUB_SHA}.tar.gz"
          git archive --format=tar.gz --output="$archive" "$GITHUB_SHA"
          (cd "$RUNNER_TEMP" && sha256sum "${GITHUB_SHA}.tar.gz" > "${GITHUB_SHA}.tar.gz.sha256")

          ssh_options=(-p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_options=(-P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${scp_options[@]}" "$archive" "${archive}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/bybit-signals/incoming/"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/bybit-signals-deploy ${GITHUB_SHA}"

name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Action: "deploy" to deploy preverified commit to production; "build" to force complete build'
        required: true
        default: 'deploy'
        type: choice
        options:
          - 'deploy'
          - 'build'
          - 'build-and-deploy'
      commit_sha:
        description: 'Commit SHA to deploy (must have passed CI and published images in GHCR; defaults to HEAD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  APP_ENV: testing
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 25432
  DB_DATABASE: bybit_test
  DB_USERNAME: postgres
  DB_PASSWORD: testpass
  DB_URL: ''
  TEST_DB_HOST: 127.0.0.1
  TEST_DB_PORT: 25432
  TEST_DB_DATABASE: bybit_test
  TEST_DB_USERNAME: postgres
  TEST_DB_PASSWORD: testpass
  RUN_DB: bybit_test
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_URL: ''
  REDIS_CLIENT: predis
  XDEBUG_MODE: off

jobs:
  inventory:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php
      - name: Discover every PHP case and partition complete files
        id: plan
        run: |
          mkdir ci-plan
          vendor/bin/phpunit --list-tests-xml ci-plan/discovery.xml
          matrix=$(python3 scripts/ci/php_shards.py plan ci-plan/discovery.xml ci-plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: php-plan
          path: ci-plan/
          if-no-files-found: error
          overwrite: true

  go-build:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          kind: build
      - name: Build all packages and shared PHP integration binaries once
        working-directory: research-go
        run: |
          go build ./...
          mkdir -p bin
          for command in research-worker historical-import historical-replay strategy-dsl; do
            go build -trimpath -o "bin/$command" "./cmd/$command"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: research-binaries
          path: research-go/bin/
          if-no-files-found: error
          overwrite: true

  go-static:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [vet, format, modules]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          kind: ${{ matrix.check }}
      - name: Go ${{ matrix.check }}
        working-directory: research-go
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            vet) go vet ./... ;;
            format) unformatted=$(gofmt -l .); test -z "$unformatted" || { echo "$unformatted"; exit 1; } ;;
            modules) go mod verify ;;
            *) exit 1 ;;
          esac

  go-checks:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [tests, race]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bybit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bybit_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REDIS_PREFIX: vector-ci-go-${{ matrix.check }}-
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go
        with:
          kind: ${{ matrix.check }}
      - uses: ./.github/actions/php
      - name: Initialize isolated PostgreSQL 17 and Redis
        run: bash scripts/ci/prepare_test_environment.sh
      - name: Go ${{ matrix.check }} with genuine PostgreSQL lifecycle tests
        working-directory: research-go
        env:
          CHECK: ${{ matrix.check }}
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          flags=()
          if [[ "$CHECK" == race ]]; then flags+=(-race); fi
          go test "${flags[@]}" -count=1 -json ./... | tee ../go-results.json
          python3 ../scripts/ci/check_go_results.py ../go-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-${{ matrix.check }}-results
          path: go-results.json
          if-no-files-found: error
          overwrite: true

  backend-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    needs: [inventory, go-build]
    runs-on: ubuntu-latest
    name: PHP (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bybit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bybit_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REDIS_PREFIX: vector-ci-${{ matrix.lane }}-
      CACHE_PREFIX: vector-ci-${{ matrix.lane }}-
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php
      - uses: actions/download-artifact@v4
        with:
          name: research-binaries
          path: research-go/bin
      - name: Restore binary permissions and expected worker path
        run: |
          chmod +x research-go/bin/*
          mkdir -p bin
          cp research-go/bin/research-worker bin/research-worker
      - uses: actions/download-artifact@v4
        with:
          name: php-plan
          path: ci-plan
      - name: Initialize isolated PostgreSQL 17 and Redis
        run: bash scripts/ci/prepare_test_environment.sh
      - name: Execute complete shard
        env:
          LANE: ${{ matrix.lane }}
        run: |
          php scripts/ci/record-isolation.php
          mv ci-results/isolation.json "ci-results/${LANE}-isolation.json"
          python3 scripts/ci/php_shards.py run "$LANE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-${{ matrix.lane }}-results
          path: ci-results/
          if-no-files-found: error
          overwrite: true

  php-quality:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php
      - run: vendor/bin/pint --test
      - name: PHP syntax verification
        run: find app bootstrap config database routes tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l > php-lint.log

  frontend-checks:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [unit, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node
      - name: Frontend ${{ matrix.check }}
        working-directory: frontend
        env:
          CHECK: ${{ matrix.check }}
        run: |
          case "$CHECK" in
            unit) npm test ;;
            typecheck) npx vue-tsc --noEmit ;;
            build) npx vite build ;;
            *) exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'build'
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          overwrite: true

  browser-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    needs: [frontend-checks, go-build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [dashboard, builder, historical, phase0]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bybit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bybit_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REDIS_PREFIX: vector-ci-browser-${{ matrix.suite }}-
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php
      - uses: ./.github/actions/node
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ci/browser-requirements.txt
      - run: pip install -r scripts/ci/browser-requirements.txt
      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/ci/browser-requirements.txt') }}
      - name: Install pinned Playwright Chrome
        run: |
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]]; then
            python3 -m playwright install-deps chrome
          else
            python3 -m playwright install --with-deps chrome
          fi
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/download-artifact@v4
        with:
          name: research-binaries
          path: research-go/bin
      - run: chmod +x research-go/bin/*
      - name: Initialize isolated PostgreSQL 17 and Redis
        run: bash scripts/ci/prepare_test_environment.sh
      - name: Browser ${{ matrix.suite }}
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/ci/run_browser.sh "$SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.suite }}-results
          path: ci-browser/
          if-no-files-found: error
          overwrite: true

  security:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [composer, npm]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/php
        if: matrix.ecosystem == 'composer'
      - uses: actions/setup-node@v4
        if: matrix.ecosystem == 'npm'
        with:
          node-version: '22'
      - name: Locked dependency audit
        env:
          ECOSYSTEM: ${{ matrix.ecosystem }}
        run: |
          case "$ECOSYSTEM" in
            composer) composer validate --strict; composer audit --locked ;;
            npm) cd frontend; npm audit --package-lock-only ;;
            *) exit 1 ;;
          esac

  workflow-policy:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/php
      - name: Cache actionlint binary
        uses: actions/cache@v4
        id: actionlint-cache
        with:
          path: /tmp/actionlint
          key: actionlint-1.7.7-linux-amd64
      - name: Install pinned workflow validator
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          if [[ ! -x /tmp/actionlint ]]; then
            curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
            echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  /tmp/actionlint.tar.gz' | sha256sum -c -
            tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          fi
          /tmp/actionlint -shellcheck=''
      - name: Policy and contract regression checks
        run: |
          set -o pipefail
          php scripts/tests/binance_contract_smoke.php
          php scripts/verify-a2-standalone.php
          php scripts/verify-gate6-standalone.php
          python3 scripts/verify-audit-log-redaction.py
          python3 -m unittest scripts/tests/test_assess_phase0_evidence.py scripts/tests/test_phase0_funding_classifier.py scripts/tests/test_vector_progress.py scripts/tests/test_cicd.py -v
          git diff --check

  deployment-resilience:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bybit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports: ['25432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bybit_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REDIS_PREFIX: vector-ci-resilience-
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/php
      - name: Initialize isolated deployment regression services
        run: bash scripts/ci/prepare_test_environment.sh
      - name: Concurrency and recovery matrix checks
        run: |
          set -o pipefail
          php scripts/test_p1_postgres_concurrency.php | tee p1-concurrency.log
          grep -q '^OVERALL VERDICT: PASS$' p1-concurrency.log
          for script in scripts/tests/test_*.sh scripts/test_deployment_recovery_matrix.sh scripts/test_same_sha_configuration_refresh.sh; do bash "$script"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-check-results
          path: |
            p1-concurrency.log
            reports/evidence/p1_concurrency_proof.json
          if-no-files-found: error
          overwrite: true

  deployment-lifecycle:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [drift, update]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Container lifecycle integration checks (${{ matrix.suite }})
        run: |
          case "${{ matrix.suite }}" in
            drift) python3 -m unittest scripts/tests/test_deployment_drift_integration.py -v ;;
            update) python3 -m unittest scripts/tests/test_deployment_update.py -v ;;
            *) exit 1 ;;
          esac

  publish-images:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'deploy'
    # Images are candidates until CI required succeeds; no dependency on verification jobs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            file: docker/php/Dockerfile
            target_stage: app
          - target: web
            file: docker/php/Dockerfile
            target_stage: web
          - target: research-worker
            file: docker/go/Dockerfile
            target_stage: ''
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Immutable candidate tag
        id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target_stage }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          load: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.metadata.outputs.timestamp }}
          cache-from: type=gha,scope=bybit-${{ matrix.target }}
          cache-to: type=gha,scope=bybit-${{ matrix.target }},mode=max
      - name: Record image digest and source identity
        env:
          TARGET: ${{ matrix.target }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          mkdir image-record
          python3 -c 'import json, os; from pathlib import Path; r = dict(target=os.environ["TARGET"], tag=os.environ["IMAGE_TAG"], digest=os.environ["DIGEST"], sha=os.environ["GITHUB_SHA"], repository=os.environ["GITHUB_REPOSITORY"], published=os.environ["PUBLISHED"] == "true"); Path("image-record/" + r["target"] + ".json").write_text(json.dumps(r) + "\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: image-record/
          if-no-files-found: error
          overwrite: true

  ci-required:
    name: CI required
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.target != 'deploy')
    needs: [inventory, backend-tests, go-build, go-static, go-checks, frontend-checks, browser-tests, php-quality, security, workflow-policy, deployment-resilience, deployment-lifecycle, publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject every non-successful mandatory dependency
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > needs.json
          python3 -c 'import json; from scripts.ci.required_gate import check_jobs; check_jobs(json.load(open("needs.json")))'
      - uses: actions/download-artifact@v4
        with:
          name: php-plan
          path: ci-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: php-*-results
          path: ci-results
          merge-multiple: true
      - name: Prove complete PHP execution without omissions or duplicates
        run: |
          set -o pipefail
          python3 scripts/ci/php_shards.py verify ci-plan/plan.json ci-results | tee php-inventory-verdict.json
          python3 scripts/ci/check_isolation.py ci-plan/plan.json ci-results
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: image-record
          merge-multiple: true
      - name: Verify all candidate image artifacts and issue eligibility manifest
        env:
          PUBLISHED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: python3 scripts/ci/required_gate.py needs.json image-record --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --published "$PUBLISHED" --output release-manifest.json
      - name: Publish verified release summary to workflow
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/report_release_summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            release-manifest.json
            php-inventory-verdict.json
          if-no-files-found: error
          overwrite: true
      - name: Capture actual hosted job and step timings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/collect_timings.py --output ci-timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-timings
          path: ci-timings.json
          if-no-files-found: error
          overwrite: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: bybit-signals-production
      cancel-in-progress: false
    needs: [ci-required]
    permissions:
      contents: read
      packages: read
      actions: read
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.target == 'deploy') ||
        (
          github.ref == 'refs/heads/main' &&
          needs.ci-required.result == 'success' &&
          (vars.ENABLE_NATIVE_DEPLOY_APPROVAL == 'true' || (github.event_name == 'workflow_dispatch' && inputs.target == 'build-and-deploy'))
        )
      )
    steps:
      - name: Start runner wall clock
        run: |
          start_ms=$(python3 -c 'import time; print(time.clock_gettime_ns(time.CLOCK_BOOTTIME) // 1000000)')
          echo "VECTOR_RUNNER_START_MS=$start_ms" >> "$GITHUB_ENV"
          echo "DEPLOY_TIMING_FILE=$RUNNER_TEMP/vector-deploy-timing.jsonl" >> "$GITHUB_ENV"
          echo "VECTOR_RUNNER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact target commit SHA
        id: target
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          source docker/scripts/timing.sh
          timing_record runner_preparation "$VECTOR_RUNNER_START_MS"
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Deploy workflow must run from main'; exit 2; }
          target_sha="${REQUESTED_SHA:-$GITHUB_SHA}"
          [[ "$target_sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Full hexadecimal SHA required'; exit 2; }
          git cat-file -e "${target_sha}^{commit}"
          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Authorize current main and exact-SHA CI required
        id: ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          source docker/scripts/timing.sh
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.target }}" == "build-and-deploy" ]]; then
            timing_run github_release_validation python3 scripts/ci/release_guard.py current --sha "$TARGET_SHA" --repository "$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "same_run=true" >> "$GITHUB_OUTPUT"
          else
            timing_run github_release_validation python3 scripts/ci/release_guard.py authorize --sha "$TARGET_SHA" --repository "$GITHUB_REPOSITORY"
            echo "same_run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "VECTOR_ARTIFACT_START_MS=$(monotonic_ms)" >> "$GITHUB_ENV"

      - name: Download verified release manifest (same run)
        if: steps.ci.outputs.same_run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified-release

      - name: Download verified release manifest (from previous CI run)
        if: steps.ci.outputs.same_run != 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified-release
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published image tags against CI-approved digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          set -Eeuo pipefail
          source docker/scripts/timing.sh
          timing_record release_artifact_download "$VECTOR_ARTIFACT_START_MS"
          python3 scripts/ci/release_guard.py manifest --sha "$TARGET_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$CI_RUN_ID" --manifest verified-release/release-manifest.json > image-refs.txt
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          timing_run github_registry_verification bash scripts/ci/verify_images.sh image-refs.txt

      - name: Deploy preverified artifacts to production
        id: deploy-step
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_COMMIT_SHA: ${{ steps.target.outputs.sha }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          source docker/scripts/timing.sh
          archive_start="$(monotonic_ms)"
          : "${DEPLOY_HOST:?DEPLOY_HOST is missing}"
          : "${DEPLOY_USER:?DEPLOY_USER is missing}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is missing}"
          : "${DEPLOY_SSH_HOST_KEY:?DEPLOY_SSH_HOST_KEY is missing}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] || { echo 'Invalid SSH port'; exit 2; }

          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519")
          (umask 077; printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts")
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

          archive="$RUNNER_TEMP/${DEPLOY_COMMIT_SHA}.tar.gz"
          # Include the verified digest manifest in the checksummed release archive.
          git archive --format=tar --output="${archive%.gz}" "$DEPLOY_COMMIT_SHA" compose.yaml compose.proxy.yaml docker
          cp verified-release/release-manifest.json "$RUNNER_TEMP/ci-release.json"
          tar -rf "${archive%.gz}" -C "$RUNNER_TEMP" ci-release.json
          gzip -n "${archive%.gz}"
          (cd "$RUNNER_TEMP" && sha256sum "${DEPLOY_COMMIT_SHA}.tar.gz" > "${DEPLOY_COMMIT_SHA}.tar.gz.sha256")

          ssh_options=(-p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp_options=(-P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          # Recheck immediately before transfer; a queued dispatch cannot deploy stale main.
          python3 scripts/ci/release_guard.py current --sha "$DEPLOY_COMMIT_SHA" --repository "$GITHUB_REPOSITORY"
          timing_record archive_and_ssh_preparation "$archive_start"
          deploy_start="$(monotonic_ms)"
          echo "Starting production deployment of preverified commit ${DEPLOY_COMMIT_SHA}..."
          timing_run archive_transfer scp "${scp_options[@]}" "$archive" "${archive}.sha256" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/bybit-signals/incoming/"
          python3 scripts/ci/release_guard.py current --sha "$DEPLOY_COMMIT_SHA" --repository "$GITHUB_REPOSITORY"
          timing_run remote_deployment_total ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/bybit-signals-deploy ${DEPLOY_COMMIT_SHA}"
          timing_record transfer_and_remote_execution "$deploy_start"
          python3 scripts/ci/report_deployed_summary.py
          cp verified-release/release-manifest.json deployed-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-release
          path: deployed-release.json
          if-no-files-found: error

      - name: Record complete runner wall time
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -f docker/scripts/timing.sh ]]; then
            source docker/scripts/timing.sh
            # GitHub supplies workflow start/queue timestamps. The workflow's final
            # duration remains the Actions run duration after this step completes.
            python3 scripts/ci/report_deploy_workflow_clock.py
            timing_record runner_wall_to_final_reporting "$VECTOR_RUNNER_START_MS"
            timing_summary | tee -a "$GITHUB_STEP_SUMMARY"
            python3 scripts/ci/report_deploy_timing_summary.py
          fi

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.html;

    server_tokens off;
    client_max_body_size 22m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types application/json application/javascript text/css text/plain text/javascript application/xml;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    auth_basic "Bybit Signals Research";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location = /up {
        auth_basic off;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /up;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 15s;
    }

    location ^~ /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
